<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>🪙 NFT Marketplace Demo</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/ethers@6.6.0/dist/ethers.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            background: #fafafa;
        }

        input {
            margin: 4px 0;
            padding: 4px;
        }

        button {
            margin-top: 6px;
            padding: 6px 10px;
        }

        #log {
            background: #111;
            color: #0f0;
            padding: 10px;
            margin-top: 16px;
            display: none;
            white-space: pre-line;
        }
    </style>
</head>

<body>
    <h2>🪙 NFT Marketplace Demo</h2>
    <button id="connectBtn">🔗 Kết nối MetaMask</button>

    <div id="info" style="display:none">
        <p>👤 Ví: <span id="account"></span></p>
        <p>💸 Phí marketplace: <span id="fee"></span> BPS</p>
    </div>

    <hr>

    <h3>📦 List NFT</h3>
    <input id="collection" placeholder="NFT Collection address" size="60" />
    <input id="tokenId" placeholder="Token ID" size="10" />
    <input id="price" placeholder="Giá (wei)" size="15" />
    <button id="listBtn">List NFT</button>

    <h3>💰 Buy NFT</h3>
    <input id="buyCollection" placeholder="NFT Collection address" size="60" />
    <input id="buyTokenId" placeholder="Token ID" size="10" />
    <button id="buyBtn">Buy NFT (ETH)</button>

    <h3>🚫 Cancel Listing</h3>
    <input id="cancelCollection" placeholder="NFT Collection address" size="60" />
    <input id="cancelTokenId" placeholder="Token ID" size="10" />
    <button id="cancelBtn">Cancel</button>

    <pre id="log"></pre>

    <script type="module">
        import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.6.0/dist/ethers.min.js";

        let provider, signer, contract, CONTRACT_ADDRESS;

        const logDiv = document.getElementById("log");
        const log = (msg) => {
            logDiv.style.display = "block";
            logDiv.textContent += msg + "\n";
            console.log(msg);
        };

        // 🧩 Tự động đọc deployed.json
        async function loadDeployed() {
            try {
                const res = await fetch("../deployed.json"); // hoặc "./deployed.json" nếu cùng thư mục
                const data = await res.json();
                log("📄 Loaded deployed.json:");
                log(JSON.stringify(data, null, 2));
                return data;
            } catch (err) {
                alert("⚠️ Không tìm thấy deployed.json! Hãy chắc chắn file nằm cùng thư mục hoặc trên thư mục index.html");
                throw err;
            }
        }

        // 🧩 Load ABI gốc từ artifacts (giữ nguyên tên)
        async function loadABI() {
            const res = await fetch("../artifacts/contracts/NftMarketplace.sol/NftMarketplace.json");
            const data = await res.json();
            return data.abi;
        }

        // 🔗 Kết nối MetaMask
        const connectBtn = document.getElementById("connectBtn");
        const infoDiv = document.getElementById("info");

        connectBtn.onclick = async () => {
                try {
                    if (!window.ethereum) {
                        alert("⚠️ Cài đặt MetaMask để tiếp tục!");
                        return;
                    }

                    // Hàm khởi tạo provider và signer
                    async function initProvider() {
                        provider = new ethers.BrowserProvider(window.ethereum);
                        signer = await provider.getSigner();
                        const addr = await signer.getAddress();
                        document.getElementById("account").textContent = addr;
                        log(`🔗 Đã kết nối ví: ${addr}`);

                        // Đọc deployed.json & ABI
                        const deployed = await loadDeployed();
                        const ABI = await loadABI();
                        CONTRACT_ADDRESS = deployed.marketplace;

                        contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
                        const fee = await contract.feeBps();
                        document.getElementById("fee").textContent = fee.toString();

                        log(`✅ Marketplace: ${CONTRACT_ADDRESS}`);
                        log(`NFT: ${deployed.nft}`);
                    }

                    // 🔹 Bước 1: kết nối lần đầu
                    await window.ethereum.request({ method: "eth_requestAccounts" });
                    await initProvider();

                    connectBtn.style.display = "none";
                    infoDiv.style.display = "block";

                    // 🔹 Bước 2: bắt sự kiện đổi ví → re-init provider + signer
                    window.ethereum.removeAllListeners("accountsChanged");
                    window.ethereum.on("accountsChanged", async (accounts) => {
                        if (accounts.length === 0) {
                            alert("⚠️ MetaMask ngắt kết nối!");
                            return;
                        }
                        const newAddr = accounts[0];
                        log(`🔄 Đã chuyển sang tài khoản mới: ${newAddr}`);
                        await initProvider(); // khởi tạo lại provider/signer/contract
                    });

                    // 🔹 Bước 3: bắt sự kiện đổi network
                    window.ethereum.removeAllListeners("chainChanged");
                    window.ethereum.on("chainChanged", async (chainId) => {
                        alert(`🔁 Network đổi sang ${chainId}, đang làm mới...`);
                        await initProvider();
                    });

                } catch (err) {
                    console.error("❌ Lỗi kết nối MetaMask:", err);
                    alert("❌ Kết nối thất bại!");
                }
            };



        // -----------------------------
        // 🏷️ List NFT
        // -----------------------------
        document.getElementById("listBtn").onclick = async () => {
            try {
                const collection = document.getElementById("collection").value.trim();
                const tokenId = document.getElementById("tokenId").value.trim();
                const price = document.getElementById("price").value.trim();
                if (!collection || !tokenId || !price) return alert("⚠️ Nhập đủ thông tin!");

                log(`List NFT ${tokenId} giá ${price} wei...`);
                const tx = await contract.list(collection, tokenId, price, ethers.ZeroAddress);
                await tx.wait();
                alert("✅ NFT đã được list thành công!");
                log("✅ List thành công!");
            } catch (err) {
                console.error(err);
                log("❌ " + err.message);
                alert("❌ Lỗi khi list NFT!");
            }
        };

        // -----------------------------
        // 💵 Buy NFT (ETH)
        // -----------------------------
        document.getElementById("buyBtn").onclick = async () => {
            try {
                const collection = document.getElementById("buyCollection").value.trim();
                const tokenId = document.getElementById("buyTokenId").value.trim();
                if (!collection || !tokenId) return alert("⚠️ Nhập đủ thông tin!");

                log(`Kiểm tra listing NFT ${tokenId}...`);
                const L = await contract.getListing(collection, tokenId);
                if (L.payToken !== ethers.ZeroAddress)
                    return alert("❌ Listing không chấp nhận ETH!");

                const tx = await contract.buyWithETH(collection, tokenId, { value: L.price });
                await tx.wait();
                alert("✅ Mua NFT thành công!");
                log("✅ Mua NFT thành công!");
            } catch (err) {
                console.error(err);
                log("❌ " + err.message);
                alert("❌ Lỗi khi mua NFT!");
            }
        };

        // -----------------------------
        // ❌ Cancel Listing
        // -----------------------------
        document.getElementById("cancelBtn").onclick = async () => {
            try {
                const collection = document.getElementById("cancelCollection").value.trim();
                const tokenId = document.getElementById("cancelTokenId").value.trim();
                if (!collection || !tokenId) return alert("⚠️ Nhập đủ thông tin!");

                log(`Hủy listing NFT #${tokenId}...`);
                const tx = await contract.cancel(collection, tokenId);
                await tx.wait();
                alert("✅ Đã hủy listing thành công!");
                log("✅ Hủy thành công!");
            } catch (err) {
                console.error(err);
                log("❌ " + err.message);
                alert("❌ Lỗi khi hủy listing!");
            }
        };
    </script>
</body>

</html>
